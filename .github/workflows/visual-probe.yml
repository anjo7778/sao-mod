name: Stage 1 Cloud Visual Probe

on:
  push:
    branches: ['stage1/cloud-visual-probe']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Install virtual display and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth imagemagick libgl1-mesa-dri
      - name: Build and prepare visual client
        run: |
          bash -n scripts/cloud-visual-probe.sh
          bash ./gradlew --no-daemon --no-configuration-cache classes
      - name: Create Floor One and capture spawn
        timeout-minutes: 12
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" bash scripts/cloud-visual-probe.sh
      - name: Upload visual probe evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sao-visual-probe-${{ github.run_number }}
          path: |
            build/visual-probe/
            run-visual/logs/
            run-visual/crash-reports/
          if-no-files-found: warn
          retention-days: 14
