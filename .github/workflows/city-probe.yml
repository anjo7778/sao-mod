name: Stage 2 Capital Visual Probe
on:
  push:
    branches: ['stage2/city-visual-probe']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: city-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Prepare graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Verify detailed capitals, furnishings, NPC presence and guardian travel
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" bash scripts/city-probe.sh
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sao-city-probe-${{ github.run_number }}
          path: |
            build/city-probe/
            run-city/city-probe/
            run-city/logs/
            run-city/crash-reports/
          if-no-files-found: warn
          retention-days: 14
