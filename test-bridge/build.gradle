plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.anjo7778'
version = '0.1.0'
base { archivesName = 'mts-test-bridge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.268'
    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
        }
    }
    mods {
        mtstestbridge { sourceSet(sourceSets.main) }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    if (providers.gradleProperty('withSao').isPresent()) {
        localRuntime files('../build/libs/sao-0.1.3.jar')
    }
}
